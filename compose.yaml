# ReelForge on Derek's home server (Docker Compose + Traefik + Cloudflare Tunnel; see deploy/README.md).
services:
  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    image: reelforge-agent:local
    container_name: reelforge-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /mnt/Storage1/app-data/reelforge/agent:/app/packages/agent/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.reelforge-agent.rule=Host(`${AGENT_DOMAIN}`)
      - traefik.http.routers.reelforge-agent.entrypoints=web
      - traefik.http.services.reelforge-agent.loadbalancer.server.port=8080
    security_opt:
      - no-new-privileges:true

  studio:
    build:
      context: .
      dockerfile: deploy/Dockerfile.studio
    image: reelforge-studio:local
    container_name: reelforge-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEB_SERVER_HOST: 0.0.0.0
      WEB_SERVER_PORT: "3001"
      MEDIA_STORE_DIR: /data/media
    volumes:
      - /mnt/Storage1/app-data/reelforge/studio:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.reelforge-studio.rule=Host(`${STUDIO_DOMAIN}`)
      - traefik.http.routers.reelforge-studio.entrypoints=web
      - traefik.http.services.reelforge-studio.loadbalancer.server.port=3001
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true